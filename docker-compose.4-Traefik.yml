version: '3'

services:

  foswiki:
    image: timlegge/docker-foswiki:latest
    restart: always
    depends_on: 
      - solr
    env_file:
      - ${PWD}/.env
    networks:
      - frontend
      - backend
    ports:
      - "$EXTERNAL_PORT:80"
    volumes:
      - foswiki_www:/var/www/foswiki:z
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${URL}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=${ACME}"

  solr:
    # Solr 9 for SolrPlugin 10.x. On first start, solr-precreate creates the core from the
    # plugin's Solr 9 configset, shipped in the image at /var/www/foswiki/solr_9.
    image: solr:9-slim
    restart: always
    command: solr-precreate foswiki /var/www/foswiki/solr_9/configsets/foswiki_configs
    networks:
      - backend
    volumes:
      - solr_data:/var/solr:z
      - foswiki_www:/var/www/foswiki:ro,z
    ulimits:
      nofile: 65000
    environment:
      - SOLR_HEAP=512m
      # make new and changed topics searchable within a few seconds
      - SOLR_OPTS=-Dsolr.autoSoftCommit.maxTime=6000 -Dsolr.autoCommit.maxTime=15000

volumes:
  foswiki_www:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/volumes/foswiki_www/
      o: bind
  solr_data:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/volumes/solr_data
      o: bind

networks:
  frontend:
    external:
      name: traefik
  backend:
    internal: true
